<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Sell & Task Management Mini App</title>
    <!-- টেলিগ্রাম মিনি অ্যাপ SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .switch-text a {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .wallet-card {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .task-item, .admin-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e1e1e1;
            font-size: 14px;
        }
        .badge {
            background: #e67e22;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- লগইন সেকশন -->
        <div id="loginSection">
            <h2>লগইন করুন</h2>
            <div class="form-group">
                <label>ইমেইল বা ফোন নম্বর</label>
                <input type="text" id="loginEmail" placeholder="আপনার ইমেইল বা ফোন দিন">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড দিন">
            </div>
            <button onclick="login()">লগইন</button>
            <div class="switch-text">
                একাউন্ট নেই? <a onclick="showRegister()">রেজিস্ট্রেশন করুন</a>
            </div>
            <div style="text-align: center; margin-top: 10px; font-size: 12px; color: #7f8c8d;">
                (এডমিন প্যানেলে প্রবেশ করতে ইমেইল বা আইডি হিসেবে <b>admin</b> এবং পাসওয়ার্ড <b>admin</b> দিন)
            </div>
        </div>

        <!-- রেজিস্ট্রেশন সেকশন -->
        <div id="registerSection" class="hidden">
            <h2>একাউন্ট তৈরি করুন</h2>
            <div class="form-group">
                <label>নাম</label>
                <input type="text" id="regName" placeholder="আপনার নাম দিন">
            </div>
            <div class="form-group">
                <label>ইমেইল বা ফোন নম্বর</label>
                <input type="text" id="regEmail" placeholder="ইমেইল বা ফোন দিন">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="regPassword" placeholder="নতুন পাসওয়ার্ড দিন">
            </div>
            <button onclick="register()">রেজিস্ট্রেশন</button>
            <div class="switch-text">
                ইতিমধ্যেই একাউন্ট আছে? <a onclick="showLogin()">লগইন করুন</a>
            </div>
        </div>

        <!-- ইউজার ড্যাশবোর্ড -->
        <div id="userDashboard" class="hidden">
            <div class="dashboard-header">
                <h3>স্বাগতম, <span id="userNameDisplay">ইউজার</span></h3>
                <button style="width: auto; padding: 5px 10px; background-color: #e74c3c; margin-top:0;" onclick="logout()">লগআউট</button>
            </div>

            <div class="wallet-card">
                <h4>ওয়ালেট ব্যালেন্স</h4>
                <h2>৳ <span id="walletBalance">0.00</span></h2>
            </div>

            <h3>পেন্ডিং টাস্কসমূহ</h3>
            <div id="userTaskList" style="margin-top: 10px;">
                <!-- ডায়নামিক টাস্ক এখানে আসবে -->
            </div>
        </div>

        <!-- এডমিন প্যানেল -->
        <div id="adminDashboard" class="hidden">
            <div class="dashboard-header">
                <h3>এডমিন প্যানেল</h3>
                <button style="width: auto; padding: 5px 10px; background-color: #e74c3c; margin-top:0;" onclick="logout()">লগআউট</button>
            </div>

            <div class="form-group">
                <label>নতুন টাস্কের নাম</label>
                <input type="text" id="taskTitleInput" placeholder="যেমন: জিমেইল ক্রিয়েট করুন">
            </div>
            <div class="form-group">
                <label>পুরস্কারের পরিমাণ (টাকা)</label>
                <input type="number" id="taskRewardInput" placeholder="যেমন: ১০">
            </div>
            <button onclick="addNewTask()">টাস্ক যোগ করুন</button>

            <h3 style="margin-top: 20px;">সকল টাস্ক তালিকা</h3>
            <div id="adminTaskList" style="margin-top: 10px;">
                <!-- এডমিন টাস্ক লিস্ট -->
            </div>
        </div>
    </div>

    <script>
        // টেলিগ্রাম মিনি অ্যাপ ইনিশিয়ালাইজেশন
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ডিফল্ট কিছু টাস্ক ডাটা
        if (!localStorage.getItem('tasks')) {
            const defaultTasks = [
                { title: 'ইউটিউব ভিডিও দেখুন', reward: 10 },
                { title: 'টেলিগ্রাম চ্যানেলে জয়েন করুন', reward: 15 }
            ];
            localStorage.setItem('tasks', JSON.stringify(defaultTasks));
        }

        let userBalance = parseFloat(localStorage.getItem('balance')) || 0.00;
        document.getElementById('walletBalance').innerText = userBalance.toFixed(2);

        function showRegister() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;

            if(name && email && pass) {
                localStorage.setItem('savedName', name);
                localStorage.setItem('savedEmail', email);
                localStorage.setItem('savedPass', pass);
                alert('রেজিস্ট্রেশন সফল হয়েছে!');
                showLogin();
            } else {
                alert('সব ঘর পূরণ করুন।');
            }
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            // এডমিন লগইন চেক
            if(email === 'admin' && pass === 'admin') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminTasks();
                return;
            }

            const savedEmail = localStorage.getItem('savedEmail');
            const savedPass = localStorage.getItem('savedPass');
            const savedName = localStorage.getItem('savedName') || 'ইউজার';

            if(email === savedEmail && pass === savedPass) {
                document.getElementById('userNameDisplay').innerText = savedName;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('userDashboard').classList.remove('hidden');
                loadUserTasks();
            } else {
                alert('ভুল ইমেইল বা পাসওয়ার্ড!');
            }
        }

        function logout() {
            document.getElementById('userDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function loadUserTasks() {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let taskListHTML = '';
            if(tasks.length === 0) {
                taskListHTML = '<p style="text-align:center; color:#7f8c8d;">কোনো টাস্ক নেই।</p>';
            } else {
                tasks.forEach((task, index) => {
                    taskListHTML += `
                        <div class="task-item">
                            <span>${task.title} <span class="badge">+৳${task.reward}</span></span>
                            <button style="width: auto; padding: 6px 12px; margin-top:0; background-color: #2ecc71;" onclick="completeTask(${index}, ${task.reward})">সম্পন্ন</button>
                        </div>
                    `;
                });
            }
            document.getElementById('userTaskList').innerHTML = taskListHTML;
        }

        function completeTask(index, reward) {
            userBalance += reward;
            localStorage.setItem('balance', userBalance);
            document.getElementById('walletBalance').innerText = userBalance.toFixed(2);
            alert('টাস্ক সম্পন্ন হয়েছে! ওয়ালেটে ৳' + reward + ' যোগ হয়েছে।');
        }

        function addNewTask() {
            const title = document.getElementById('taskTitleInput').value;
            const reward = parseFloat(document.getElementById('taskRewardInput').value);

            if(title && reward) {
                let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                tasks.push({ title, reward });
                localStorage.setItem('tasks', JSON.stringify(tasks));
                document.getElementById('taskTitleInput').value = '';
                document.getElementById('taskRewardInput').value = '';
                loadAdminTasks();
                alert('নতুন টাস্ক সফলভাবে যোগ করা হয়েছে!');
            } else {
                alert('সঠিক তথ্য দিন।');
            }
        }

        function loadAdminTasks() {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let adminListHTML = '';
            if(tasks.length === 0) {
                adminListHTML = '<p style="text-align:center; color:#7f8c8d;">কোনো টাস্ক নেই।</p>';
            } else {
                tasks.forEach((task, index) => {
                    adminListHTML += `
                        <div class="admin-item">
                            <span>${task.title} (৳${task.reward})</span>
                            <button style="width: auto; padding: 5px 10px; margin-top:0; background-color: #e74c3c;" onclick="deleteTask(${index})">ডিলিট</button>
                        </div>
                    `;
                });
            }
            document.getElementById('adminTaskList').innerHTML = adminListHTML;
        }

        function deleteTask(index) {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            tasks.splice(index, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            loadAdminTasks();
        }
    </script>
</body>
</html>
