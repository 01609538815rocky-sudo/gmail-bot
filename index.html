<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskEarn BD - Mini App</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; height: 100vh; max-height: 800px; background: var(--card); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }
        .screen { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .screen.active { display: block; }
        h2 { margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--muted); }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .nav { height: 60px; background: #0f172a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
        .nav-item { text-align: center; color: var(--muted); cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; color: var(--muted); cursor: pointer; }
        .link span { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <!-- লগইন স্ক্রিন -->
    <div id="login" class="screen active">
        <h2 style="text-align:center; border:none; margin-top:40px;">লগইন করুন</h2>
        <div class="group"><label>ইমেইল বা ফোন</label><input type="text" id="lEmail"></div>
        <div class="group"><label>পাসওয়ার্ড</label><input type="password" id="lPass"></div>
        <button class="btn" onclick="login()">লগইন</button>
        <div class="link" onclick="show('register')">অ্যাকাউন্ট নেই? <span>রেজিস্ট্রেশন করুন</span></div>
    </div>

    <!-- রেজিস্ট্রেশন স্ক্রিন -->
    <div id="register" class="screen">
        <h2 style="text-align:center; border:none; margin-top:20px;">রেজিস্ট্রেশন</h2>
        <div class="group"><label>নাম</label><input type="text" id="rName"></div>
        <div class="group"><label>ইমেইল বা ফোন</label><input type="text" id="rEmail"></div>
        <div class="group"><label>পাসওয়ার্ড</label><input type="password" id="rPass"></div>
        <button class="btn" onclick="register()">রেজিস্ট্রেশন সম্পন্ন</button>
        <div class="link" onclick="show('login')">ইতিমধ্যে অ্যাকাউন্ট আছে? <span>লগইন</span></div>
    </div>

    <!-- হোম স্ক্রিন -->
    <div id="home" class="screen">
        <h2>হোম ড্যাশবোর্ড</h2>
        <div style="background:linear-gradient(135deg,#2563eb,#1d4ed8); padding:15px; border-radius:8px; text-align:center; margin-bottom:15px;">
            <p style="font-size:12px;">মূল ব্যালেন্স</p>
            <h1 id="bal" style="font-size:24px; margin-top:5px;">৳ 0.00</h1>
        </div>
        <div class="card" onclick="openTask('Gmail Sell')"><span>📧 জিমেইল সেল</span><span>➔</span></div>
        <div class="card" onclick="openTask('Facebook Sell')"><span>📘 ফেসবুক সেল</span><span>➔</span></div>
        <div class="card" onclick="openTask('Instagram Sell')"><span>📸 ইনস্টাগ্রাম সেল</span><span>➔</span></div>
    </div>

    <!-- টাস্ক সাবমিট স্ক্রিন -->
    <div id="task" class="screen">
        <h2 id="taskTitle">টাস্ক</h2>
        <div class="group"><label>অ্যাকাউন্ট নাম / ইউজারনেম</label><input type="text" id="tName"></div>
        <div class="group"><label>পাসওয়ার্ড</label><input type="text" id="tPass"></div>
        <button class="btn" onclick="submitTask()">সাবমিট করুন</button>
        <div class="link" onclick="show('home')">← হোম পেজে ফিরে যান</div>
    </div>

    <!-- উইথড্র স্ক্রিন -->
    <div id="withdraw" class="screen">
        <h2>টাকা উত্তোলন</h2>
        <div class="group">
            <label>মেথড</label>
            <select id="wMethod"><option>বিকাশ</option><option>নগদ</option><option>রকেট</option></select>
        </div>
        <div class="group"><label>পরিমাণ</label><input type="number" id="wAmt"></div>
        <div class="group"><label>নম্বর</label><input type="text" id="wNum"></div>
        <button class="btn" onclick="submitWithdraw()">উইথড্র রিকোয়েস্ট পাঠান</button>
    </div>

    <!-- প্রোফাইল স্ক্রিন -->
    <div id="profile" class="screen">
        <h2>প্রোফাইল</h2>
        <div class="group"><label>নাম</label><input type="text" id="pName" disabled></div>
        <div class="group"><label>ইমেইল</label><input type="text" id="pEmail" disabled></div>
        <button class="btn" style="background:var(--danger); margin-top:20px;" onclick="show('login')">লগআউট</button>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="nav" id="navBar" style="display:none;">
        <div class="nav-item active" onclick="show('home', this)">🏠 হোম</div>
        <div class="nav-item" onclick="show('withdraw', this)">💳 উইথড্র</div>
        <div class="nav-item" onclick="show('profile', this)">👤 প্রোফাইল</div>
    </div>
</div>

<script>
    let curUser = null;
    function show(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }
    }
    function register() {
        let name = document.getElementById('rName').value, email = document.getElementById('rEmail').value, pass = document.getElementById('rPass').value;
        if(!name || !email || !pass) return alert('সব পূরণ করুন!');
        let users = JSON.parse(localStorage.getItem('users')) || [];
        if(users.find(u => u.email === email)) return alert('ইমেইল ইতিমধ্যে রেজিস্টার্ড!');
        users.push({name, email, pass, balance: 100});
        localStorage.setItem('users', JSON.stringify(users));
        alert('সফল হয়েছে! লগইন করুন।');
        show('login');
    }
    function login() {
        let email = document.getElementById('lEmail').value, pass = document.getElementById('lPass').value;
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let user = users.find(u => u.email === email && u.pass === pass);
        if(user) {
            curUser = user;
            document.getElementById('bal').innerText = `৳ ${user.balance}.00`;
            document.getElementById('pName').value = user.name;
            document.getElementById('pEmail').value = user.email;
            document.getElementById('navBar').style.display = 'flex';
            show('home');
        } else {
            alert('ভুল তথ্য!');
        }
    }
    function openTask(title) {
        document.getElementById('taskTitle').innerText = title;
        show('task');
    }
    function submitTask() {
        alert('টাস্ক সাবমিট হয়েছে!');
        show('home');
    }
    function submitWithdraw() {
        let amt = parseFloat(document.getElementById('wAmt').value);
        if(!amt || curUser.balance < amt) return alert('অপর্যাপ্ত ব্যালেন্স বা ভুল তথ্য!');
        curUser.balance -= amt;
        document.getElementById('bal').innerText = `৳ ${curUser.balance}.00`;
        alert('উইথড্র রিকোয়েস্ট সফল হয়েছে!');
        show('home');
    }
</script>
</body>
  </html>
