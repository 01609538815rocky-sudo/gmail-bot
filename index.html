<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেলিগ্রাম মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        /* ব্যানার স্টাইল */
        .banner {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        .banner h1 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .banner p {
            font-size: 14px;
            opacity: 0.85;
        }
        /* জিমেইল ও ফেসবুক বাটন সেকশন */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }
        .platform-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-decoration: none;
        }
        .platform-btn:active {
            transform: scale(0.96);
        }
        .gmail-btn {
            background-color: #ea4335; /* জিমেইল অরিজিনাল কালার */
        }
        .fb-btn {
            background-color: #1877f2; /* ফেসবুক অরিজিনাল কালার */
        }
        .platform-btn img, .platform-btn svg {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- মূল ব্যানার -->
        <div class="banner">
            <h1>টেলিগ্রাম মিনি অ্যাপ</h1>
            <p>আপনার অ্যাকাউন্ট দিয়ে কাজ শুরু করুন</p>
        </div>

        <!-- জিমেইল ও ফেসবুক বাটন -->
        <div class="button-group">
            <!-- জিমেইল বাটন -->
            <button class="platform-btn gmail-btn" onclick="handlePlatform('Gmail')">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                Gmail Sell
            </button>

            <!-- ফেসবুক বাটন -->
            <button class="platform-btn fb-btn" onclick="handlePlatform('Facebook')">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff">
                    <path d="M12 2.04c-5.5 0-10 4.5-10 10 0 5 3.66 9.13 8.44 9.88v-6.99h-2.54v-2.89h2.54V9.79c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.89h-2.33v6.98c4.78-.75 8.44-4.88 8.44-9.88 0-5.5-4.5-10-10-10z"/>
                </svg>
                Facebook
            </button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function handlePlatform(platformName) {
            alert(platformName + ' অপশন সিলেক্ট করা হয়েছে!');
            // এখানে পরবর্তী কাজের লজিক বা ফাইল আপলোডের পেজে রিডাইレクト করার কোড যোগ করতে পারেন।
        }
    </script>
</body>
</html>
