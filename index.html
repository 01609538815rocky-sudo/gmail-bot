<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD FREELANCING ACADEMY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #fff9f5 !important;
            color: #333333 !important;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            padding-bottom: 70px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #ff7f00;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .banner {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #ff7f00, #ff4500);
            color: white;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 15px;
        }
        .item {
            background: #fff;
            border: 1px solid #ffe5d0;
            padding: 15px 5px;
            text-align: center;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ff7f00;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
</script>

</body>
</html>
