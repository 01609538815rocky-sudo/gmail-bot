<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Freelance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .primary-bg { background-color: #ff6600; }
        .primary-text { color: #ff6600; }
        .card-bg { background-color: #1e1e1e; }
    </style>
</head>
<body class="pb-16">

    <header class="flex justify-between items-center p-4 card-bg border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bars text-xl text-gray-300 cursor-pointer"></i>
            <h1 class="text-lg font-bold tracking-wide text-orange-500">BD Freelance Hub</h1>
        </div>
        <div class="flex items-center space-x-3">
            <i class="fa-regular fa-bell text-xl text-gray-300 cursor-pointer"></i>
            <i class="fa-regular fa-user text-xl text-gray-300 cursor-pointer"></i>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">

        <div class="card-bg p-3 rounded-xl border border-gray-800 text-center shadow-md">
            <div class="bg-orange-500 text-black font-bold py-1 px-3 rounded-lg text-xs inline-block mb-1">NOTICE</div>
            <p class="text-xs text-gray-300">সঠিক নিয়মে কাজ করুন। কাজ সম্পন্ন করার সাথে সাথে ব্যালেন্স আপডেট হয়ে যাবে!</p>
        </div>

        <div class="card-bg p-4 rounded-xl border border-gray-800 shadow-md">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-400">MAIN / REFERRAL WALLET</p>
                    <h2 class="text-2xl font-bold text-orange-400 mt-1">৳ <span id="main-balance">0.00</span></h2>
                </div>
                <div class="text-right">
                    <p class="text-[11px] text-gray-400">তারিখ</p>
                    <p class="text-xs font-semibold text-gray-300" id="current-date"></p>
                </div>
            </div>
        </div>

        <div class="space-y-2">
            <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-wider">কাজের প্রজেক্টসমূহ</h3>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="completeTask('জিমেইল সেল', 16.00)" class="card-bg p-3.5 rounded-xl border border-gray-800 hover:border-orange-500 transition cursor-pointer flex items-center space-x-3">
                    <i class="fa-solid fa-envelope text-orange-500 text-xl"></i>
                    <div>
                        <p class="text-xs font-bold">Gmail Sell</p>
                        <p class="text-[10px] text-orange-400">৳ 16.00</p>
                    </div>
                </div>
                <div onclick="completeTask('ভিডিও টাস্ক', 10.00)" class="card-bg p-3.5 rounded-xl border border-gray-800 hover:border-orange-500 transition cursor-pointer flex items-center space-x-3">
                    <i class="fa-solid fa-video text-orange-500 text-xl"></i>
                    <div>
                        <p class="text-xs font-bold">Video Task</p>
                        <p class="text-[10px] text-orange-400">৳ 10.00</p>
                    </div>
                </div>
                <div onclick="completeTask('টাইপিং জব', 12.00)" class="card-bg p-3.5 rounded-xl border border-gray-800 hover:border-orange-500 transition cursor-pointer flex items-center space-x-3">
                    <i class="fa-solid fa-keyboard text-orange-500 text-xl"></i>
                    <div>
                        <p class="text-xs font-bold">Typing Job</p>
                        <p class="text-[10px] text-orange-400">৳ 12.00</p>
                    </div>
                </div>
                <div onclick="completeTask('ডাটা এন্ট্রি', 15.00)" class="card-bg p-3.5 rounded-xl border border-gray-800 hover:border-orange-500 transition cursor-pointer flex items-center space-x-3">
                    <i class="fa-solid fa-file-lines text-orange-500 text-xl"></i>
                    <div>
                        <p class="text-xs font-bold">Data Entry</p>
                        <p class="text-[10px] text-orange-400">৳ 15.00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-bg p-4 rounded-xl border border-gray-800">
            <h3 class="text-xs font-semibold mb-3 text-orange-400 border-b border-gray-800 pb-2 uppercase tracking-wider">ইনকাম হিস্টরি</h3>
            <div id="income-history-list" class="space-y-2 text-xs">
                <p class="text-gray-500 text-center py-3">এখনও কোনো ইনকাম জমা হয়নি।</p>
            </div>
        </div>

    </main>

    <script>
        // Set Current Date
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

        // Initial Balance & History State
        let userBalance = 0.00;
        let incomeHistory = [];

        // Function when user clicks any task button
        function completeTask(taskName, amount) {
            userBalance += amount;
            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            incomeHistory.unshift({
                taskName: taskName,
                amount: amount.toFixed(2),
                time: timeNow
            });

            // Update UI
            document.getElementById('main-balance').innerText = userBalance.toFixed(2);
            updateHistoryUI();
        }

        // Update History List UI
        function updateHistoryUI() {
            const historyContainer = document.getElementById('income-history-list');
            if (incomeHistory.length === 0) {
                historyContainer.innerHTML = `<p class="text-gray-500 text-center py-3">এখনও কোনো ইনকাম জমা হয়নি।</p>`;
            } else {
                historyContainer.innerHTML = incomeHistory.map(item => `
                    <div class="flex justify-between items-center bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                        <div>
                            <p class="font-medium text-gray-200">${item.taskName} সম্পন্ন</p>
                            <p class="text-[10px] text-gray-400">${item.time}</p>
                        </div>
                        <span class="text-orange-400 font-bold">+৳ ${item.amount}</span>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
