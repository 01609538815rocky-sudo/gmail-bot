<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Freelancing Academy</title>
    <style>
        :root {
            --primary-color: #ff7700;
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-main: #333333;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
            max-width: 480px;
            margin: auto;
            margin-bottom: 70px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--primary-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .nav-item {
            color: white;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>BD FREELANCING ACADEMY</header>

    <div class="container">
        <!-- জিমেইল সাবমিট ফর্ম সেকশন -->
        <div class="card">
            <h3>জিমেইল সাবমিট ফর্ম</h3>
            <p style="font-size: 13px; color: #666;">নিচের ফরমটি সঠিক তথ্য দিয়ে পূরণ করুন</p>
            
            <label>আজকের পাসওয়ার্ড</label>
            <input type="text" value="@rakib002" readonly style="background: #f1f1f1;">

            <label>জিমেইল লিখুন</label>
            <input type="email" placeholder="example@gmail.com">

            <label>অ্যাডমিন সেট করা পাসওয়ার্ড লিখুন</label>
            <input type="password" placeholder="Gmail পাসওয়ার্ড">

            <button class="btn">সাবমিট করুন</button>
        </div>
    </div>

    <!-- নিচের নেভিগেশন বার -->
    <div class="nav-bar">
        <a href="#" class="nav-item">🏠<br>হোম</a>
        <a href="#" class="nav-item">💳<br>ওয়ালেট</a>
        <a href="#" class="nav-item">💸<br>উইথড্র</a>
        <a href="#" class="nav-item">👥<br>নেটওয়ার্ক</a>
        <a href="#" class="nav-item">👤<br>প্রোফাইল</a>
    </div>

</body>
</html>
