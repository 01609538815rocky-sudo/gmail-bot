<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskEarn BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .card { background: #f9f9f9; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #0088cc; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #006699; }
        .btn-danger { background: #dc3545; }
        .nav-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- মেনু বাটন -->
    <div class="nav-bar">
        <button onclick="showPanel('user')">ইউজার প্যানেল</button>
        <button onclick="showPanel('admin-login')" style="background: #28a745;">এডমিন প্যানেল</button>
    </div>

    <!-- ১. ইউজার প্যানেল -->
    <div id="user-section">
        <h2>উপলব্ধ কাজসমূহ</h2>
        <div id="task-list">লোড হচ্ছে...</div>
    </div>

    <!-- ২. এডমিন লগইন সেকশন -->
    <div id="admin-login-section" style="display:none;">
        <h2>এডমিন লগইন</h2>
        <input type="text" id="phone" placeholder="মোবাইল নম্বর (01743815478)">
        <input type="password" id="password" placeholder="পাসওয়ার্ড (102050)">
        <button onclick="verifyAdmin()">লগইন করুন</button>
    </div>

    <!-- ৩. এডমিন ড্যাশবোর্ড (যেখান থেকে কাজ ও সাবমিশন কন্ট্রোল করবেন) -->
    <div id="admin-dashboard" style="display:none;">
        <h2>এডমিন কন্ট্রোল প্যানেল</h2>
        <button class="btn-danger" onclick="showPanel('user')">লগআউট / ইউজার ভিউতে যান</button>
        
        <hr>
        <h3>নতুন কাজ যোগ করুন</h3>
        <input type="text" id="task-title" placeholder="কাজের নাম (যেমন: Gmail Create)">
        <input type="number" id="task-reward" placeholder="টাকা (যেমন: 10)">
        <input type="text" id="task-link" placeholder="কাজের লিংক">
        <button onclick="addNewTask()">কাজ পাবলিশ করুন</button>

        <hr>
        <h3>ইউজারদের জমা দেওয়া কাজ</h3>
        <div id="admin-submissions">কোনো পেন্ডিং কাজ নেই।</div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let username = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name : "TelegramUser";

    // ডিফল্ট ডাটা সেটআপ
    if (!localStorage.getItem('tasks')) {
        localStorage.setItem('tasks', JSON.stringify([
            { id: 1, title: 'Gmail Account Create', reward: 10, link: 'https://t.me' }
        ]));
    }
    if (!localStorage.getItem('submissions')) {
        localStorage.setItem('submissions', JSON.stringify([]));
    }

    function showPanel(panel) {
        document.getElementById('user-section').style.display = 'none';
        document.getElementById('admin-login-section').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'none';

        if (panel === 'user') {
            document.getElementById('user-section').style.display = 'block';
            loadTasks();
        } else if (panel === 'admin-login') {
            document.getElementById('admin-login-section').style.display = 'block';
        } else if (panel === 'admin-dashboard') {
            document.getElementById('admin-dashboard').style.display = 'block';
            loadSubmissions();
        }
    }

    function loadTasks() {
        let tasks = JSON.parse(localStorage.getItem('tasks'));
        let html = '';
        if (tasks.length === 0) {
            html = '<p>এই মুহূর্তে কোনো কাজ নেই।</p>';
        } else {
            tasks.forEach(t => {
                html += `
                    <div class="card">
                        <h3>${t.title}</h3>
                        <p>পুরস্কার: <b>৳${t.reward}</b></p>
                        <p><a href="${t.link}" target="_blank" style="color: #0088cc; font-weight: bold;">লিংকে ভিজিট করুন</a></p>
                        <button onclick="submitTask(${t.id})">কাজ জমা দিন</button>
                    </div>
                `;
            });
        }
        document.getElementById('task-list').innerHTML = html;
    }

    function submitTask(taskId) {
        let proof = prompt("আপনার কাজের প্রুফ (যেমন: আপনার জিমেইল বা ইউজারনেম) দিন:");
        if (!proof) return;

        let tasks = JSON.parse(localStorage.getItem('tasks'));
        let task = tasks.find(t => t.id === taskId);
        let subs = JSON.parse(localStorage.getItem('submissions'));

        subs.push({
            subId: Date.now(),
            title: task.title,
            reward: task.reward,
            username: username,
            proof: proof,
            status: 'Pending'
        });

        localStorage.setItem('submissions', JSON.stringify(subs));
        alert('আপনার কাজটি সফলভাবে জমা হয়েছে!');
    }

    function verifyAdmin() {
        let p = document.getElementById('phone').value;
        let pass = document.getElementById('password').value;

        if (p === '01743815478' && pass === '102050') {
            alert('লগইন সফল হয়েছে!');
            showPanel('admin-dashboard');
        } else {
            alert('ভুল নম্বর বা পাসওয়ার্ড!');
        }
    }

    function addNewTask() {
        let title = document.getElementById('task-title').value;
        let reward = Number(document.getElementById('task-reward').value);
        let link = document.getElementById('task-link').value;

        if (!title || !reward || !link) {
            alert('সবগুলো ঘর পূরণ করুন!');
            return;
        }

        let tasks = JSON.parse(localStorage.getItem('tasks'));
        tasks.push({ id: Date.now(), title, reward, link });
        localStorage.setItem('tasks', JSON.stringify(tasks));

        alert('নতুন কাজ সফলভাবে যোগ করা হয়েছে!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-reward').value = '';
        document.getElementById('task-link').value = '';
        loadTasks();
    }

    function loadSubmissions() {
        let subs = JSON.parse(localStorage.getItem('submissions'));
        let html = '';
        let pending = subs.filter(s => s.status === 'Pending');

        if (pending.length === 0) {
            html = '<p>কোনো পেন্ডিং কাজ নেই।</p>';
        } else {
            pending.forEach(s => {
                html += `
                    <div class="card">
                        <p><b>কাজ:</b> ${s.title} (৳${s.reward})</p>
                        <p><b>ইউজার:</b> ${s.username}</p>
                        <p><b>প্রুফ:</b> ${s.proof}</p>
                        <button onclick="updateStatus(${s.subId}, 'Approved')">অ্যাপ্রুভ করুন</button>
                        <button class="btn-danger" onclick="updateStatus(${s.subId}, 'Rejected')">রিজেক্ট করুন</button>
                    </div>
                `;
            });
        }
        document.getElementById('admin-submissions').innerHTML = html;
    }

    function updateStatus(subId, status) {
        let subs = JSON.parse(localStorage.getItem('submissions'));
        subs = subs.map(s => {
            if (s.subId === subId) s.status = status;
            return s;
        });
        localStorage.setItem('submissions', JSON.stringify(subs));
        alert(`কাজটি ${status === 'Approved' ? 'অ্যাপ্রুভ' : 'রিজেক্ট'} করা হয়েছে!`);
        loadSubmissions();
    }

    // অ্যাপ চালু হলে ইউজার প্যানেল দেখাবে
    showPanel('user');
</script>

</body>
</html>
