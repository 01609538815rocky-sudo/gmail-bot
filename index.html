<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; }
        .user-info h3 { font-size: 16px; color: #38bdf8; }
        .balance-badge { background: #0284c7; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        /* Banner Card */
        .banner { background: linear-gradient(135deg, #1e3a8a, #0284c7); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .banner h2 { font-size: 20px; margin-bottom: 8px; }
        .banner p { font-size: 13px; opacity: 0.9; }

        /* Services Grid (Gmail Sell, Facebook, Instagram) */
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .service-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .service-card:hover { border-color: #38bdf8; background: #334155; }
        .service-card img { width: 35px; height: 35px; margin-bottom: 8px; object-fit: contain; }
        .service-card span { font-size: 12px; font-weight: 600; display: block; }

        /* Wallet & Stats Box */
        .stats-box { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center; }
        .stat-item h4 { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .stat-item p { font-size: 16px; font-weight: bold; color: #38bdf8; }

        /* Admin Panel Section */
        .admin-section { background: #1e293b; border-radius: 12px; padding: 15px; margin-top: 10px; border: 1px dashed #64748b; }
        .admin-section h3 { font-size: 14px; margin-bottom: 10px; color: #facc15; }
        .admin-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 8px; }
        .admin-btn { width: 100%; padding: 10px; background: #eab308; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #adminResult { margin-top: 10px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <h3>T2Z Earn</h3>
                <span style="font-size: 11px; color: #94a3b8;">Mini App</span>
            </div>
            <div class="balance-badge" id="userBalance">৳ 12.50</div>
        </div>

        <!-- Banner -->
        <div class="banner">
            <h2>সোশ্যাল সার্ভিস ও জিমেইল সেল</h2>
            <p>আপনার ডিজিটাল ব্যবসার নিরাপদ মাধ্যম</p>
        </div>

        <!-- 3 Main Options (Gmail Sell, Facebook, Instagram) -->
        <div class="services-grid">
            <div class="service-card" onclick="alert('Gmail Sell অপশন সিলেক্ট করা হয়েছে!')">
                <img src="https://cdn-icons-png.flaticon.com/512/281/281769.png" alt="Gmail">
                <span>Gmail Sell</span>
            </div>
            <div class="service-card" onclick="alert('Facebook অপশন সিলেক্ট করা হয়েছে!')">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
                <span>Facebook</span>
            </div>
            <div class="service-card" onclick="alert('Instagram অপশন সিলেক্ট করা হয়েছে!')">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
                <span>Instagram</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-box">
            <div class="stat-item">
                <h4>Today Earned</h4>
                <p>৳ 2.30</p>
            </div>
            <div class="stat-item">
                <h4>Total Balance</h4>
                <p>৳ 12.50</p>
            </div>
        </div>

        <!-- Admin Panel Login (Password: 102050) -->
        <div class="admin-section">
            <h3>🔐 Admin Panel Access</h3>
            <input type="password" id="adminPass" class="admin-input" placeholder="Enter Admin Password (102050)">
            <button class="admin-btn" onclick="loginAdmin()">Login Admin</button>
            <div id="adminResult"></div>
        </div>
    </div>

    <script>
        // Telegram WebApp initialization
        let tg = window.Telegram.WebApp;
        tg.expand();

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === '102050') {
                document.getElementById('adminResultinnerHTML = `✅ <b>Admin Login Successful!</b><br>Total Users: 1,284 | Total Balance: ৳12,450`;
                document.getElementById('adminResult').style.color = '#4ade80';
            } else {
                document.getElementById('adminResult').innerHTML = `❌ ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।`;
                document.getElementById('adminResult').style.color = '#f87171';
            }
        }
    </script>
</body>
</html>
