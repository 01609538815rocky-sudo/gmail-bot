<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাইক্রো জব মিনি অ্যাপ ও এডমিন</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .card { background: #f9f9f9; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #0088cc; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #006699; }
        .btn-danger { background: #dc3545; }
        .nav-btn { background: #6c757d; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="nav-section">
        <button class="nav-btn" onclick="switchView('user')">ইউজার প্যানেল (কাজ করুন)</button>
        <button class="nav-btn" onclick="switchView('admin-login')">এডমিন প্যানেল</button>
    </div>

    <!-- ইউজার প্যানেল -->
    <div id="user-view">
        <h2>উপলব্ধ কাজসমূহ</h2>
        <div id="task-list">লোড হচ্ছে...</div>
    </div>

    <!-- এডমিন লগইন পেজ -->
    <div id="admin-login-view" style="display:none;">
        <h2>এডমিন লগইন</h2>
        <input type="text" id="admin-phone" placeholder="মোবাইল নম্বর (যেমন: 01743815478)">
        <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড">
        <button onclick="loginAdmin()">লগইন করুন</button>
    </div>

    <!-- এডমিন ড্যাশবোর্ড -->
    <div id="admin-dashboard" style="display:none;">
        <h2>এডমিন কন্ট্রোল প্যানেল</h2>
        <button class="btn-danger" onclick="switchView('user')">লগআউট / ইউজার View</button>
        
        <hr>
        <h3>নতুন কাজ যোগ করুন</h3>
        <input type="text" id="new-title" placeholder="কাজের নাম (যেমন: Gmail Create)">
        <input type="number" id="new-reward" placeholder="টাকা (যেমন: 10)">
        <input type="text" id="new-link" placeholder="কাজের লিংক">
        <button onclick="addTask()">কাজ পাবলিশ করুন</button>

        <hr>
        <h3>ইউজারদের সাবমিট করা কাজ</h3>
        <div id="admin-submissions">কোনো কাজ নেই।</div>
    </div>
</div>

<script>
    // টেলিগ্রাম ইনিশিয়ালাইজেশন
    let tg = window.Telegram.WebApp;
    tg.expand();
    let username = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name : "TelegramUser";

    // লোকাল স্টোরেজে ডাটা সংরক্ষণ (ব্রাউজার বা অ্যাপ রিফ্রেশ হলেও ডাটা থাকবে)
    if (!localStorage.getItem('tasks')) {
        localStorage.setItem('tasks', JSON.stringify([
            { id: 1, title: 'Gmail Account Create', reward: 10, link: 'https://t.me' },
            { id: 2, title: 'Facebook Page Follow', reward: 8, link: 'https://facebook.com' }
        ]));
    }
    if (!localStorage.getItem('submissions')) {
        localStorage.setItem('submissions', JSON.stringify([]));
    }

    function switchView(view) {
        document.getElementById('user-view').style.display = 'none';
        document.getElementById('admin-login-view').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'none';

        if (view === 'user') {
            document.getElementById('user-view').style.display = 'block';
            loadUserTasks();
        } else if (view === 'admin-login') {
            document.getElementById('admin-login-view').style.display = 'block';
        } else if (view === 'admin-dashboard') {
            document.getElementById('admin-dashboard').style.display = 'block';
            loadAdminSubmissions();
        }
    }

    // ইউজার ভিউয়ের কাজ লোড করা
    function loadUserTasks() {
        let tasks = JSON.parse(localStorage.getItem('tasks'));
        let html = '';
        if (tasks.length === 0) {
            html = '<p>এই মুহূর্তে কোনো কাজ নেই।</p>';
        } else {
            tasks.forEach(t => {
                html += `
                    <div class="card">
                        <h3>${t.title}</h3>
                        <p>পুরস্কার: <b>৳${t.reward}</b></p>
                        <p><a href="${t.link}" target="_blank" style="color: #0088cc; font-weight: bold;">লিংকে যান</a></p>
                        <button onclick="submitTask(${t.id})">কাজ জমা দিন</button>
                    </div>
                `;
            });
        }
        document.getElementById('task-list').innerHTML = html;
    }

    function submitTask(taskId) {
        let proof = prompt("আপনার কাজের প্রুফ (যেমন: আপনার অ্যাকাউন্ট নাম বা স্ক্রিনশট লিংক) দিন:");
        if (!proof) return;

        let tasks = JSON.parse(localStorage.getItem('tasks'));
        let task = tasks.find(t => t.id === taskId);

        let subs = JSON.parse(localStorage.getItem('submissions'));
        subs.push({ subId: Date.now(), title: task.title, reward: task.reward, username: username, proof: proof, status: 'Pending' });
        localStorage.setItem('submissions', JSON.stringify(subs));

        alert('আপনার কাজটি সফলভাবে জমা হয়েছে!');
    }

    // এডমিন লগইন চেক
    function loginAdmin() {
        let phone = document.getElementById('admin-phone').value;
        let pass = document.getElementById('admin-pass').value;

        // আপনার দেওয়া নাম্বার ও পাসওয়ার্ড
        if (phone === '01743815478' && pass === '102050') {
            alert('লগইন সফল হয়েছে!');
            switchView('admin-dashboard');
        } else {
            alert('ভুল নম্বর অথবা পাসওয়ার্ড!');
        }
    }

    // এডমিন নতুন কাজ যোগ করা
    function addTask() {
        let title = document.getElementById('new-title').value;
        let reward = Number(document.getElementById('new-reward').value);
        let link = document.getElementById('new-link').value;

        if (!title || !reward || !link) {
            alert('সবগুলো ঘর পূরণ করুন!');
            return;
        }

        let tasks = JSON.parse(localStorage.getItem('tasks'));
        tasks.push({ id: Date.now(), title, reward, link });
        localStorage.setItem('tasks', JSON.stringify(tasks));

        alert('কাজ সফলভাবে যোগ করা হয়েছে!');
        document.getElementById('new-title').value = '';
        document.getElementById('new-reward').value = '';
        document.getElementById('new-link').value = '';
        loadUserTasks();
    }

    // এডমিন সাবমিশন দেখা
    function loadAdminSubmissions() {
        let subs = JSON.parse(localStorage.getItem('submissions'));
        let html = '';
        let pendingSubs = subs.filter(s => s.status === 'Pending');

        if (pendingSubs.length === 0) {
            html = '<p>কোনো পেন্ডিং কাজ নেই।</p>';
        } else {
            pendingSubs.forEach(s => {
                html += `
                    <div class="card">
                        <p><b>কাজ:</b> ${s.title} (৳${s.reward})</p>
                        <p><b>ইউজার:</b> ${s.username}</p>
                        <p><b>প্রুফ:</b> ${s.proof}</p>
                        <button onclick="actionSub(${s.subId}, 'Approve')">অ্যাপ্রুভ করুন</button>
                        <button class="btn-danger" onclick="actionSub(${s.subId}, 'Reject')">রিজেক্ট করুন</button>
                    </div>
                `;
            });
        }
        document.getElementById('admin-submissions').innerHTML = html;
    }

    function actionSub(subId, action) {
        let subs = JSON.parse(localStorage.getItem('submissions'));
        subs = subs.map(s => {
            if (s.subId === subId) {
                s.status = action === 'Approve' ? 'Approved' : 'Rejected';
            }
            return s;
        });
        localStorage.setItem('submissions', JSON.stringify(subs));
        alert(`কাজটি ${action === 'Approve' ? 'অ্যাপ্রুভ' : 'রিজেক্ট'} করা হয়েছে!`);
        loadAdminSubmissions();
    }

    // প্রথম লোডে ইউজার প্যানেল দেখাবে
    loadUserTasks();
</script>

</body>
</html>
