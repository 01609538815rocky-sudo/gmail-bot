<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BD Freelancing Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 90px; min-height: 100vh; }
        .header { background-color: #ff7700; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; text-align: center; }
        
        .profile-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .img-container { position: relative; width: 100px; height: 100px; margin: 0 auto 15px auto; }
        .img-container img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #ff7700; }
        .img-container input { position: absolute; bottom: 0; right: 0; opacity: 0; width: 100px; height: 100px; cursor: pointer; }
        .upload-badge { position: absolute; bottom: 0; right: 0; background: #ff7700; color: white; padding: 5px; border-radius: 50%; font-size: 12px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; background: #fafafa; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ff7700; display: flex; justify-content: space-around; padding: 10px 0; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .nav-item { color: white; text-decoration: none; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">প্রোফাইল তথ্য</div>

    <div class="container">
        <div class="profile-card">
            <div class="img-container">
                <img id="profilePic" src="https://via.placeholder.com/100" alt="Profile">
                <span class="upload-badge">📷</span>
                <input type="file" accept="image/*" onchange="previewImage(event)">
            </div>
            
            <div class="form-group">
                <label>রেফার কোড</label>
                <input type="text" value="621672" readonly>
            </div>
            <div class="form-group">
                <label>আপনার নাম (Registration Name)</label>
                <input type="text" id="regName" value="LxMAIDUL TADER">
            </div>
            <div class="form-group">
                <label>জিমেইল এড্রেস</label>
                <input type="text" id="regEmail" value="01410047521l@gmail.com">
            </div>
            <div class="form-group">
                <label>মোবাইল নাম্বার</label>
                <input type="text" id="regPhone" value="01334056349">
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">🏠 হোম</a>
        <a href="#" class="nav-item">💳 ওয়ালেট</a>
        <a href="#" class="nav-item">💸 উইথড্র</a>
        <a href="network.html" class="nav-item">👥 নেটওয়ার্ক</a>
        <a href="profile.html" class="nav-item active">👤 প্রোফাইল</a>
    </div>

    <script>
        function previewImage(event) {
            let reader = new FileReader();
            reader.onload = function() {
                let output = document.getElementById('profilePic');
                output.src = reader.result;
                localStorage.setItem('savedProfilePic', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        window.onload = function() {
            let savedPic = localStorage.getItem('savedProfilePic');
            if(savedPic) {
                document.getElementById('profilePic').src = savedPic;
            }
        }
    </script>
</body>
  </html>
