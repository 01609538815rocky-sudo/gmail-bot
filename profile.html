<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BD Freelancing Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 90px; min-height: 100vh; }
        .header { background-color: #ff7700; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; text-align: center; }
        
        .profile-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .img-container { position: relative; width: 100px; height: 100px; margin: 0 auto 15px auto; }
        .img-container img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #ff7700; }
        .img-container input { position: absolute; bottom: 0; right: 0; opacity: 0; width: 100px; height: 100px; cursor: pointer; }
        .upload-badge { position: absolute; bottom: 0; right: 0; background: #ff7700; color: white; padding: 5px; border-radius: 50%; font-size: 12px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #475569; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #f8fafc; color: #333; }
        
        .logout-btn { background: #ef4444; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ff7700; display: flex; justify-content: space-around; padding: 10px 0; border-top-left-radius: 15px; border-top-right-radius: 15px; z-index: 1000; }
        .nav-item { color: white; text-decoration: none; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-item.active { font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">ইউজার প্রোফাইল</div>

    <div class="container">
        <div class="profile-card">
            <div class="img-container">
                <img id="profilePic" src="https://via.placeholder.com/100" alt="Profile">
                <span class="upload-badge">📷</span>
                <input type="file" accept="image/*" onchange="previewImage(event)">
            </div>
            
            <div class="form-group">
                <label>নাম</label>
                <input type="text" id="pName" readonly>
            </div>
            <div class="form-group">
                <label>জিমেইল এড্রেস</label>
                <input type="text" id="pEmail" readonly>
            </div>
            <div class="form-group">
                <label>মোবাইল নাম্বার</label>
                <input type="text" id="pPhone" readonly>
            </div>
            <div class="form-group">
                <label>বর্তমান ব্যালেন্স</label>
                <input type="text" id="pBalance" style="color: #ff7700; font-weight: bold;" readonly>
            </div>

            <button class="logout-btn" onclick="logoutUser()">লগআউট করুন</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>হোম</span></a>
        <a class="nav-item" onclick="alert('ওয়ালেট ব্যালেন্স: ' + (localStorage.getItem('userBalance') || '0.00') + ' TK')"><span class="icon">💳</span><span>ওয়ালেট</span></a>
        <a class="nav-item" onclick="alert('হোম পেজে উইথড্র অপশন ব্যবহার করুন')"><span class="icon">💸</span><span>উইথড্র</span></a>
        <a href="network.html" class="nav-item"><span class="icon">👥</span><span>নেটওয়ার্ক</span></a>
        <a href="profile.html" class="nav-item active"><span class="icon">👤</span><span>প্রোফাইল</span></a>
    </div>

    <script>
        window.onload = function() {
            // Load Registered Data
            document.getElementById('pName').value = localStorage.getItem('userName') || 'নাম পাওয়া যায়নি';
            document.getElementById('pEmail').value = localStorage.getItem('userEmail') || 'email@gmail.com';
            document.getElementById('pPhone').value = localStorage.getItem('userPhone') || '01XXXXXXXXX';
            document.getElementById('pBalance').value = (localStorage.getItem('userBalance') || '0.00') + ' TK';

            let savedPic = localStorage.getItem('savedProfilePic');
            if(savedPic) { document.getElementById('profilePic').src = savedPic; }
        }

        function previewImage(event) {
            let reader = new FileReader();
            reader.onload = function() {
                document.getElementById('profilePic').src = reader.result;
                localStorage.setItem('savedProfilePic', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function logoutUser() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'register.html';
        }
    </script>
</body>
</html>
